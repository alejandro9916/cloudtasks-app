<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudTasks Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>☁️ CloudTasks</h1>

        <div class="task-form">

            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
            >

            <button onclick="login()">
                Iniciar Sesión
            </button>

            <button onclick="goRegister()">
                Registrarse
            </button>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
