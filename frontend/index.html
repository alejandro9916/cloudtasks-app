<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudTasks App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CloudTasks App</h1>

        <p class="subtitle">
            Gestión profesional de tareas en la nube
        </p>

        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Escribe una nueva tarea"
            >

            <button onclick="addTask()">
                Agregar
            </button>

        </div>

        <div class="stats">

            <div class="card">
                <h3 id="totalTasks">0</h3>
                <p>Total</p>
            </div>

            <div class="card">
                <h3 id="completedTasks">0</h3>
                <p>Completadas</p>
            </div>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
