<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>📝 Registro</h1>

        <div class="task-form">

            <input
                type="text"
                id="username"
                placeholder="Usuario"
            >

            <input
                type="email"
                id="email"
                placeholder="Correo"
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
            >

            <button onclick="register()">
                Crear Cuenta
            </button>

            <button onclick="goLogin()">
                Volver al Login
            </button>

        </div>

    </div>

    <script src="register.js"></script>

</body>

</html>
